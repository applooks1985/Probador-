<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#c2410c">
<title>Probador</title>
<style>
:root{--bg:#faf8f5;--fg:#1c1b1a;--mut:#77726b;--card:#fff;--ac:#c2410c;--bd:#e6e1d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#171615;--fg:#f2efe9;--mut:#a09a90;--card:#232120;--ac:#fb923c;--bd:#37332f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding-bottom:80px}
main{max-width:480px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
input,select,button{font:inherit}
input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}.mut{color:var(--mut);font-size:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;white-space:nowrap}.btn.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--mut)}nav button.on{color:var(--ac);font-weight:600}
.th{width:56px;height:56px;border-radius:10px;border:1px solid var(--bd);object-fit:cover;flex:none}
.res{width:100%;border-radius:10px;margin-top:10px}.lb{position:relative;display:inline-block}.lb input{position:absolute;inset:0;opacity:0;width:100%}
</style></head><body><main id="app"></main>
<nav><button data-t="foto">Mi foto</button><button data-t="lista">Prendas</button></nav>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
let S={photo:null,items:[],tab:'foto'},form={name:'',brand:'',price:'',img:'',url:'',msg:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('probador')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('probador',JSON.stringify(S))}catch(e){alert('Sin espacio guardado')}};
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};i.src=r.result};r.readAsDataURL(f)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
async function extract(u){form.url=u;form.msg='Leyendo enlace…';render();
 try{const j=await(await fetch('/api/extract?url='+encodeURIComponent(u))).json();
  if(j.error)throw new Error(j.error);
  form.name=j.name||'';form.brand=j.brand||'';form.price=j.price||'';form.img=j.image||'';
  form.msg=j.ok?'Datos leídos. Revísalos y pulsa Añadir.':'No pude leer datos de esta tienda. Rellénalos a mano.'}
 catch(e){form.msg=e.message}render()}
async function tryon(id){const it=S.items.find(x=>x.id==id);
 if(!S.photo){alert('Sube primero tu foto');S.tab='foto';return render()}
 if(!it.img){alert('Esta prenda necesita imagen');return}
 it.busy='Enviando…';render();
 try{const r=await fetch('/api/tryon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({person:S.photo,garment:it.img,name:it.name,category:it.cat||'upper_body'})});
  const j=await r.json();if(j.error)throw new Error(j.error);
  for(let n=0;n<60;n++){it.busy='Generando… ('+(n*3)+' s)';render();await new Promise(r=>setTimeout(r,3000));
   const s=await(await fetch('/api/tryon?id='+j.id)).json();
   if(s.status==='succeeded'){it.result=[].concat(s.output)[0];break}
   if(s.status==='failed'||s.status==='canceled')throw new Error(s.error||'La IA no pudo generar la imagen')}
  if(!it.result)throw new Error('Tardó demasiado')}
 catch(e){alert(e.message)}
 it.busy=null;save();render()}
function render(){
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));const a=$('#app');
if(S.tab==='foto'){
 a.innerHTML=`<h1>Tu foto de pie</h1><div class="card"><p class="mut">De frente, cuerpo entero y fondo liso. Se envía a la IA solo al probar una prenda.</p>${S.photo?`<img src="${S.photo}" style="width:100%;border-radius:10px;margin-bottom:8px">`:''}<label class="btn lb">${S.photo?'Cambiar foto':'Subir foto'}<input type="file" id="pf" accept="image/*"></label></div>`;
 $('#pf').onchange=e=>e.target.files[0]&&shrink(e.target.files[0],900,d=>{S.photo=d;save();render()});return}
a.innerHTML=`<h1>Prendas</h1><div class="card"><div class="row"><input type="text" id="u" placeholder="Pega el enlace de la prenda" value="${esc(form.url)}"><button class="btn" id="rd">Leer</button></div><p class="mut" id="ms">${esc(form.msg)}</p>
<input type="text" id="n" placeholder="Prenda" value="${esc(form.name)}"><input type="text" id="b" placeholder="Marca" value="${esc(form.brand)}"><input type="number" id="p" placeholder="Precio €" step="0.01" value="${esc(form.price)}">
<select id="c"><option value="upper_body">Parte de arriba</option><option value="lower_body">Parte de abajo</option><option value="dresses">Vestido / conjunto</option></select>
${form.img?`<img class="th" src="${esc(form.img)}" onerror="this.style.display='none'"> `:''}<label class="btn g lb">${form.img?'Cambiar imagen':'Subir imagen de la prenda'}<input type="file" id="gf" accept="image/*"></label> <button class="btn" id="add">Añadir</button></div><div id="ls"></div>`;
$('#rd').onclick=()=>$('#u').value.trim()&&extract($('#u').value.trim());
const keep=()=>{form.name=$('#n').value;form.brand=$('#b').value;form.price=$('#p').value;form.url=$('#u').value};
$('#gf').onchange=e=>{keep();e.target.files[0]&&shrink(e.target.files[0],800,d=>{form.img=d;render()})};
$('#add').onclick=()=>{keep();if(!form.name)return $('#n').focus();S.items.unshift({id:Date.now(),name:form.name,brand:form.brand,price:+form.price||0,img:form.img,url:form.url,cat:$('#c').value});form={name:'',brand:'',price:'',img:'',url:'',msg:''};save();render()};
$('#ls').innerHTML=S.items.map(i=>`<div class="card"><div class="row">${i.img?`<img class="th" src="${esc(i.img)}" onerror="this.style.display='none'">`:''}<div style="flex:1"><b>${esc(i.name)}</b><div class="mut">${esc(i.brand)} · ${i.price.toFixed(2)} €</div>${i.url?`<a class="mut" href="${esc(i.url)}" target="_blank" rel="noopener">Ver en tienda</a>`:''}</div><button class="btn g" data-d="${i.id}">✕</button></div>
<button class="btn" style="margin-top:8px;width:100%" data-t="${i.id}" ${i.busy?'disabled':''}>${i.busy||(i.result?'Volver a probar con IA':'Probar con IA')}</button>${i.result?`<img class="res" src="${esc(i.result)}">`:''}</div>`).join('')||'<p class="mut">Aún no hay prendas.</p>';
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.items=S.items.filter(x=>x.id!=b.dataset.d);save();render()});
document.querySelectorAll('[data-t]').forEach(b=>{if(b.dataset.t&&b.tagName==='BUTTON'&&b.classList.contains('btn')&&b.style.width)b.onclick=()=>tryon(b.dataset.t)});
}
const q=new URLSearchParams(location.search),sh=q.get('url')||(q.get('text')||'').match(/https?:\/\/\S+/)?.[0];
if(sh){S.tab='lista';history.replaceState(null,'','/');render();extract(sh)}else render();
</script></body></html>
